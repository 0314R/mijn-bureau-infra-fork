
# Source: element-web/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: element-web
  namespace: "omara-sep"
  labels:
    app.kubernetes.io/instance: element-web
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: element-web
    app.kubernetes.io/version: 1.12.8
    helm.sh/chart: element-web-0.1.0
    app.kubernetes.io/component: element-web
    app.kubernetes.io/part-of: element-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: element-web
      app.kubernetes.io/name: element-web
      app.kubernetes.io/component: element-web
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        # Allow dns resolution
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  ingress:
    - ports:
        - port: 8080
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: element-web
              app.kubernetes.io/name: element-web
        - podSelector:
            matchLabels:
              element-web-client: "true"
    - ports:
        - port: 8080
          protocol: TCP
---
