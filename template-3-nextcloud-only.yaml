# Source: nextcloud/templates/networkpolicy-cronjob.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-cronjob
  namespace: "omara-sep"
  labels:
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/version: 32.0.5
    helm.sh/chart: nextcloud-0.1.0
    app.kubernetes.io/component: nextcloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/component: nextcloud-cronjob
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        # Allow dns resolution
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: primary
              app.kubernetes.io/name: postgresql
    - ports:
        - port: 6379
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: master
              app.kubernetes.io/name: redis
    - ports:
        - port: 9000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
    - ports:
        - port: 443
          protocol: TCP
      to: []
    - ports:
        - port: 80
          protocol: TCP
      to: []
  ingress:
    - ports:
        - port: 8080
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: nextcloud
              app.kubernetes.io/name: nextcloud
        - podSelector:
            matchLabels:
              nextcloud-client: "true"
    - ports:
        - port: 8080
          protocol: TCP
