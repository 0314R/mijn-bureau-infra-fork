apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: "omara-sep"
  labels:
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/version: 32.0.5
    helm.sh/chart: nextcloud-0.1.0
    app.kubernetes.io/component: nextcloud
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/component: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/version: 32.0.5
        helm.sh/chart: nextcloud-0.1.0
        app.kubernetes.io/component: nextcloud
    spec:
      imagePullSecrets:
        - name: null
      serviceAccountName: nextcloud
      automountServiceAccountToken: false
      affinity:
        podAffinity:

        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: nextcloud
                    app.kubernetes.io/name: nextcloud
                    app.kubernetes.io/component: nextcloud
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:

      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      initContainers:
        - name: "nextcloud-php-provisioning"
          resources:
            limits:
              cpu: 750m
              ephemeral-storage: 2Gi
              memory: 768Mi
            requests:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 512Mi
          image: registry-1.docker.io/library/nextcloud:32.0.5-apache
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -ec
            - |
              #!/bin/bash

              echo "Start provisioning"
              cp /usr/local/etc/php/php.ini-production /shared/php.ini
              mkdir -p /shared/conf.d
              echo "Setup default PHP config"
              cp /usr/local/etc/php/conf.d/*.ini /shared/conf.d/
              if [ -d /php-configs ]; then
                echo "Setup custom PHP config"
                cp /php-configs/* /shared/conf.d/
              fi
              echo "Provisioning completed"
          volumeMounts:
            - name: empty-dir
              mountPath: /shared
      containers:
        - name: "nextcloud"
          image: registry-1.docker.io/library/nextcloud:32.0.5-apache
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: nextcloud-username
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: nextcloud-password

            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-externalredis
                  key: password

            - name: OBJECTSTORE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-externalminio
                  key: username
            - name: OBJECTSTORE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-externalminio
                  key: password

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-externaldatabase
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-externaldatabase
                  key: password
          envFrom:
            - configMapRef:
                name: nextcloud-env-vars
          resources:
            limits:
              cpu: 750m
              ephemeral-storage: 2Gi
              memory: 768Mi
            requests:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
          volumeMounts:
            - name: post-install-dir
              mountPath: /docker-entrypoint-hooks.d/post-installation
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: empty-dir
              mountPath: /usr/local/etc/php/php.ini
              subPath: php.ini
            - name: empty-dir
              mountPath: /usr/local/etc/php/conf.d
              subPath: conf.d
            - name: empty-dir
              mountPath: /var/run/apache2
              subPath: apache-run
            - name: nextcloud-data
              mountPath: /var/www/
              subPath: root
            - name: nextcloud-data
              mountPath: /var/www/html
              subPath: html
            - name: nextcloud-data
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud-data
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: nextcloud-data
              mountPath: /var/www/tmp
              subPath: tmp
            - name: nextcloud-data
              mountPath: /var/www/html/themes
              subPath: themes
            - name: nextcloud-config
              mountPath: /var/www/html/config/.htaccess
              subPath: .htaccess
