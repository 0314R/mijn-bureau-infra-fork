apiVersion: batch/v1
kind: Job
metadata:
  name: synapse-keygen
  namespace: "omara-sep"
  labels:
    app.kubernetes.io/instance: synapse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: synapse
    app.kubernetes.io/part-of: synapse
    app.kubernetes.io/version: 1.145.0
    helm.sh/chart: synapse-0.1.0
    app.kubernetes.io/component: synapse-keygen
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit:  20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
        app.kubernetes.io/instance: synapse
        app.kubernetes.io/component: synapse-keygen
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      imagePullSecrets:
        - name: null
      restartPolicy: OnFailure
      serviceAccountName: synapse-keygen
      initContainers:
        - name: kubectl
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              cp /opt/bitnami/kubectl/bin/kubectl /tmp/kubectl
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: empty-dir
              mountPath: /tmp
      containers:
        - name: synapse-keygen
          image: registry-1.docker.io/matrixdotorg/synapse:v1.145.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Check if secret already exists
              if /tmp/kubectl get secret synapse-signing-key >/dev/null 2>&1; then
                echo "Secret 'synapse-signing-key' already exists, skipping creation"
                exit 0
              fi

              synapse_homeserver \
                --config-path /synapse/config/homeserver.yaml \
                --generate-keys

              /tmp/kubectl create secret generic synapse-signing-key --from-file=/synapse/keys/synapse_signing_key
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /synapse/config
              name: synapse
              readOnly: true
            - name: synapse-keys
              mountPath: /synapse/keys
            - name: empty-dir
              mountPath: /tmp
      volumes:
        - name: synapse-keys
          emptyDir: {}
        - name: synapse
          configMap:
            defaultMode: 420
            name: synapse
        - name: empty-dir
          emptyDir: {}
