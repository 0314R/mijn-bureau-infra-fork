                port:
                  name: http
    - host: omara-sep.cloud.first8.nl
      http:
        paths:
        - backend:
            service:
              name: keycloak
              port:
                number: 80
          path: /
          pathType: Prefix
  tls:
    - hosts:
        - "id.kubernetes.local"
      secretName: id.kubernetes.local-tls
